<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login Membro</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#0A2A5E;color:#fff;text-align:center;padding:30px 20px}.box{background:#fff;color:#0A2A5E;border-radius:20px;padding:20px;max-width:400px;margin:0 auto}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin-top:10px;font-size:16px}button{width:100%;padding:14px;border:none;border-radius:12px;background:#0A2A5E;color:#fff;font-weight:bold;font-size:16px;margin-top:12px}a{color:#fff;display:block;margin-top:16px}</style></head>
<body>
<h2>🙏 SOU MEMBRO</h2><p>Digite seu nome e sua senha</p><br>
<div class="box">
<input id="nome" placeholder="Seu nome">
<input id="senha" type="password" placeholder="Sua senha">
<button onclick="entrar()">ENTRAR →</button>
<p id="erro" style="color:red;font-size:13px;margin-top:10px"></p>
</div>
<a href="index.html">← Voltar</a>
<script>
function entrar(){
var s=document.getElementById("senha").value;
var n=document.getElementById("nome").value;
if(n==""){document.getElementById("erro").innerHTML="Digite seu nome!";return}
if(btoa(s)=="MTIzNA=="){window.location.href="membro.html"}else{document.getElementById("erro").innerHTML="Senha errada!"}
}
</script>
</body></html>
