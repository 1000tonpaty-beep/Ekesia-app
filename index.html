<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ekesia - Igreja Batista Memorial</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#0A2A5E;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.box{background:#fff;width:100%;max-width:380px;border-radius:22px;padding:22px;text-align:center}.box img{width:110px;height:110px;object-fit:cover;border-radius:50%;background:#eee}h1{color:#0A2A5E;font-size:22px;margin:10px 0 2px}p{color:#666;font-size:13px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin-top:10px}button{width:100%;padding:14px;border:none;border-radius:12px;background:#0A2A5E;color:#fff;font-weight:bold;margin-top:10px}button.verde{background:#25D366}button.cinza{background:#eee;color:#333}.tabs{display:flex;gap:8px;margin-top:14px}.tabs button{flex:1}.tabs button.ativo{background:#0A2A5E;color:#fff}.esqueci{font-size:12px;color:#0A2A5E;display:block;margin-top:8px;cursor:pointer}.pastor-link{font-size:11px;color:#999;display:block;margin-top:18px;cursor:pointer}.hidden{display:none}</style></head>
<body>
<div class="box">
<img id="logo" src="IMG-20261112-WA8647.jpg">
<h1 id="nomeIgreja">IGREJA BATISTA MEMORIAL</h1><p id="endIgreja">Campo Grande - MS</p>

<div class="tabs"><button id="btnMembro" class="ativo" onclick="mostrar('membro')">👤 MEMBRO</button><button id="btnVisit" onclick="mostrar('visitante')">👋 VISITANTE</button></div>

<!-- MEMBRO -->
<div id="telaMembro">
<input id="nomeMembro" placeholder="Seu nome">
<input id="senhaMembro" type="password" placeholder="Sua senha">
<button onclick="entrarMembro()">ENTRAR COMO MEMBRO</button>
<span class="esqueci" onclick="recuperarMembro()">🔑 Esqueci minha senha</span>
<p style="margin-top:10px;font-size:12px">Novo aqui? <b onclick="cadastrar()" style="color:#0A2A5E;cursor:pointer">Cadastre-se</b></p>
</div>

<!-- VISITANTE -->
<div id="telaVisitante" class="hidden">
<p style="margin-top:10px">Conheça nossa igreja, sem precisar de cadastro!</p>
<button class="verde" onclick="location.href='visitante.html'">👋 ENTRAR COMO VISITANTE</button>
</div>

<!-- PASTOR ESCONDIDO -->
<div id="telaPastor" class="hidden">
<input id="senhaPastor" type="password" placeholder="Senha do Pastor">
<button onclick="entrarPastor()">ENTRAR COMO PASTOR 🔒</button>
<span class="esqueci" onclick="recuperarPastor()">🔑 Esqueci a senha do pastor</span>
<span class="esqueci" onclick="mostrar('membro')">← Voltar para Membro</span>
</div>

<span class="pastor-link" onclick="mostrar('pastor')">⚙️ Acesso do Pastor</span>
</div>

<script>
function mostrar(t){
document.getElementById("telaMembro").classList.add("hidden");
document.getElementById("telaVisitante").classList.add("hidden");
document.getElementById("telaPastor").classList.add("hidden");
document.getElementById("btnMembro").classList.remove("ativo");
document.getElementById("btnVisit").classList.remove("ativo");
if(t=="membro"){document.getElementById("telaMembro").classList.remove("hidden");document.getElementById("btnMembro").classList.add("ativo")}
if(t=="visitante"){document.getElementById("telaVisitante").classList.remove("hidden");document.getElementById("btnVisit").classList.add("ativo")}
if(t=="pastor"){document.getElementById("telaPastor").classList.remove("hidden")}
}
function cadastrar(){
var nome=document.getElementById("nomeMembro").value.trim();
var senha=document.getElementById("senhaMembro").value.trim();
if(!nome||!senha){alert("Digite nome e crie uma senha!");return}
var pend=JSON.parse(localStorage.getItem("membros_pendentes")||"[]");
var aprov=JSON.parse(localStorage.getItem("membros_aprovados")||"[]");
var cad=JSON.parse(localStorage.getItem("membros_cadastro")||"{}");
if(cad[nome]){alert("Esse nome já tem cadastro! Tenta entrar.");return}
cad[nome]=senha; localStorage.setItem("membros_cadastro",JSON.stringify(cad));
pend.push({nome:nome}); localStorage.setItem("membros_pendentes",JSON.stringify(pend));
alert("✅ Cadastro enviado! Aguarde o pastor aprovar!");
}
function entrarMembro(){
var nome=document.getElementById("nomeMembro").value.trim();
var senha=document.getElementById("senhaMembro").value.trim();
var cad=JSON.parse(localStorage.getItem("membros_cadastro")||"{}");
if(!cad[nome]){alert("Você ainda não tem cadastro! Clica em Cadastre-se primeiro!");return}
if(cad[nome]!==senha){alert("❌ Senha errada! Clica em 'Esqueci minha senha'");return}
var aprov=JSON.parse(localStorage.getItem("membros_aprovados")||"[]");
var achou=aprov.find(m=>m.nome==nome);
if(!achou && nome.toLowerCase()!="paty"){alert("⏳ Seu cadastro ainda está aguardando aprovação do pastor!");return}
localStorage.setItem("nome_membro",nome);
location.href="membro.html";
}
function recuperarMembro(){
var nome=prompt("Digite seu nome de cadastro para recuperar:");
if(!nome)return;
var cad=JSON.parse(localStorage.getItem("membros_cadastro")||"{}");
if(!cad[nome]){alert("Nome não encontrado! Faça um novo cadastro.");return}
var nova=prompt("Digite uma NOVA senha para "+nome+":");
if(!nova)return;
cad[nome]=nova; localStorage.setItem("membros_cadastro",JSON.stringify(cad));
alert("✅ Senha nova criada! Agora é só entrar com a senha nova: "+nova);
document.getElementById("senhaMembro").value=nova;
}
function entrarPastor(){
var s=document.getElementById("senhaPastor").value;
var senhaSalva=localStorage.getItem("senha_pastor")||"1234";
if(s!==senhaSalva){alert("❌ Senha do pastor errada!");return}
location.href="pastor.html";
}
function recuperarPastor(){
var codigo=prompt("Para recuperar a senha do pastor, digite o código mestre da igreja:\n(Dica: o código inicial é 123456)");
if(codigo!=="123456"){alert("Código errado! Fala com o pastor principal.");return}
var nova=prompt("Digite a NOVA senha do pastor:");
if(!nova)return;
localStorage.setItem("senha_pastor",nova);
alert("✅ Nova senha do pastor criada! Anota aí: "+nova);
document.getElementById("senhaPastor").value=nova;
}
var ln=localStorage.getItem("igreja_nome");if(ln)document.getElementById("nomeIgreja").innerHTML=ln;
var le=localStorage.getItem("igreja_end");if(le)document.getElementById("endIgreja").innerHTML=le;
var lg=localStorage.getItem("igreja_logo");if(lg)document.getElementById("logo").src=lg;
</script>
</body></html>
